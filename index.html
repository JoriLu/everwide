.hl{outline:2px dashed #3b82f6!important;background:#eff6ff!important}

.tgt{outline:3px solid #ef4444!important;box-shadow:0 0 16px #ef444466!important}

.bad{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.is-rel,.is-rel .nm{color:var(--rel)!important;font-weight:700}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px}
.legend{display:flex;align-items:center;gap:16px;font-size:13.5px;font-weight:700;color:var(--sub)}

.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--bd2);padding-bottom:12px;margin-bottom:16px}

/* --- 霸味（費用由程式計算） --- */
function parseMember(s) {
  const [nm, it = ''] = s.split(':'), rel = nm[0] === '~';
  const items = it ? it.split(',').map(x => { const [n, q = 1] = x.split('*'); return {n, q: +q, p: PRICE[n]}; }) : [];
  if (items.some(i => i.p == null)) console.warn('找不到單價：', items.filter(i => i.p == null));
  return {name: rel ? nm.slice(1) : nm, rel, items, total: items.reduce((a, i) => a + i.p * i.q, 0)};
}
function bwTable(T) {
  const rows = T.m.map(parseMember), n = rows.length, size = +T.t[0];
  const base = Math.floor(PKG / n), quota = Math.floor(SUBSIDY - PKG / n);
  let emp = null, poolOver = 0;
  if (T.pool) poolOver = Math.max(0, rows.reduce((a, r) => a + r.total, 0) - quota * n);
  rows.forEach((r, i) => {
    if (T.pool) { r.res = `${i ? '' : '全桌額度合算加點 ＝ '}${pill(i ? 'ok' : poolOver ? 'bad' : 'ok', '自付 ' + money(i ? 0 : poolOver))}`; return; }
    if (!r.rel) {
      emp = r; r.over = Math.max(0, r.total - quota); r.left = Math.max(0, quota - r.total); r.left0 = r.left; r.rels = [];
    } else {
      const due = base + r.total, use = Math.min(emp.left, due); emp.left -= use; r.pay = due - use; emp.rels.push(r);
      r.res = `基本套餐費 ${money(base)}${r.total ? ` ＋ 加點 ${money(r.total)}` : ''}${use ? ` － 員工餘額 ${money(use)}` : ''} ＝ ${pill(r.pay ? 'bad' : 'ok', '自付 ' + money(r.pay))}`;
    }
  });
  rows.forEach(r => {
    if (r.rel || T.pool) return;
    r.res = r.over ? `超額 ${money(r.over)} ＝ ${pill('bad', '自付 ' + money(r.over))}`
      : pill('ok', '未超額，自付 $0') + (r.rels.length && r.left0 ? `<span class="sn">（額度剩 ${money(r.left0)} 可扣抵親屬）</span>` : '');
  });
  const notes = [T.note && pill('warn', T.note, 1), n < size && pill('warn', `因少${size - n}人，員工額度調整 ${money(quota)} (每人${money(SUBSIDY)} - 套餐${money(PKG)}/實際人數${n}人)`, 1)].filter(Boolean).join(' ');
  let h = `<tr class="g"><td colspan="2">${T.t}（${n}人）</td><td colspan="2" class="r">${notes}</td></tr>`;
  rows.forEach((r, i) => {
    const chips = r.items.length ? `<div class="chips">${r.items.map(it => `<span class="chip">${esc(it.n)}<i>${money(it.p)}</i><em>×${it.q}</em></span>`).join('')}</div>` : '<span class="none">(無加點)</span>';
    h += `<tr class="p"><td class="bn${r.rel ? ' is-rel' : ''}"><span class="nm">${esc(r.name)}</span></td><td>${chips}</td><td class="amt">${money(r.total)}</td><td>${r.res}</td></tr>`;
    const nxt = rows[i + 1];
    if (!T.pool && r.rel && (!nxt || !nxt.rel) && emp !== null) {
      const owner = rows.slice(0, i + 1).reverse().find(x => !x.rel);
      if (owner.rels.length > 1) {
        const due = owner.rels.reduce((a, x) => a + base + x.total, 0), pay = owner.rels.reduce((a, x) => a + x.pay, 0);
        h += `<tr class="sub"><td colspan="4"><b style="color:var(--sub);margin-right:8px">眷屬合併結算：</b>眷屬應付 ${money(due)} － 員工餘額 ${money(due - pay)} ＝ ${pill('bad', '自付 ' + money(pay))}</td></tr>`;
      }
    }
  });
  return h;
}

let hits = [], idx = -1;

function clearFx() { $$('.hl,.cur,.tgt').forEach(el => el.classList.remove('hl', 'cur', 'tgt')); }
function search(raw) {
  clearFx(); hits = []; idx = -1;
  const q = norm(raw.trim()), cnt = $('#cnt');
  cnt.hidden = !q;
  if (!q) return;
  $$('.p .nm').forEach(nm => {
    if (!norm(nm.textContent).includes(q)) return;
    const el = nm.closest('.p');
    hits.push({el, tbl: el.closest('.tbl') || el, tab: el.closest('.view').id});
    el.classList.add('hl');
  });
  if (hits.length) { idx = 0; focusHit(); } else cnt.textContent = '0/0';
}

  $$('.cur,.tgt').forEach(el => el.classList.remove('cur', 'tgt'));

  h.el.classList.add('cur');

  requestAnimationFrame(() => h.tbl.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'center'}));
}

qEl.addEventListener('compositionend', () => search(qEl.value));
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { qEl.value = ''; search(''); }
});
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
</script>
</body>
</html>
